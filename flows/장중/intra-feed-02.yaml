# 보조 플로우(장중): 모의 서버에서 CPU를 몇 초 쓰고 끝난다. deploy/gen_flows.sh로 만든다.
id: intra-feed-02
schedule: "*/5 * * * *"
steps:
  - id: step-1
    host: feed-04
    command: [eum, burn, --cpu, "1", --duration, 5s]
  - id: step-2
    host: feed-04
    command: [eum, burn, --cpu, "1", --duration, 7s]
    depends: [step-1]
