# 보조 플로우(장중): 모의 서버에서 CPU를 몇 초 쓰고 끝난다. deploy/gen_flows.sh로 만든다.
id: intra-gw-02
schedule: "0 10 * * 1-5"
steps:
  - id: step-1
    host: gw-04
    command: [eum, burn, --cpu, "1", --duration, 7s]
  - id: step-2
    host: gw-04
    command: [eum, burn, --cpu, "1", --duration, 2s]
    depends: [step-1]
  - id: step-3
    host: gw-04
    command: [eum, burn, --cpu, "1", --duration, 4s]
    depends: [step-1]
