# 보조 플로우(개장준비): 모의 서버에서 CPU를 몇 초 쓰고 끝난다. deploy/gen_flows.sh로 만든다.
id: open-ref-01
schedule: "0 4 * * 1-5"
steps:
  - id: step-1
    host: feed-01
    command: [eum, burn, --cpu, "1", --duration, 6s]
  - id: step-2
    host: feed-01
    command: [eum, burn, --cpu, "1", --duration, 8s]
    depends: [step-1]
