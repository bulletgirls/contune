# 보조 플로우(주간월간): 모의 서버에서 CPU를 몇 초 쓰고 끝난다. deploy/gen_flows.sh로 만든다.
id: monthly-ops-01
schedule: "0 3 1 * *"
steps:
  - id: step-1
    host: ops-03
    command: [eum, burn, --cpu, "1", --duration, 6s]
  - id: step-2
    host: ops-03
    command: [eum, burn, --cpu, "1", --duration, 8s]
    depends: [step-1]
  - id: step-3
    host: ops-03
    command: [eum, burn, --cpu, "1", --duration, 3s]
    depends: [step-1]
