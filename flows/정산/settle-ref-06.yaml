# 보조 플로우(정산): 모의 서버에서 CPU를 몇 초 쓰고 끝난다. deploy/gen_flows.sh로 만든다.
id: settle-ref-06
schedule: "50 17 * * 1-5"
steps:
  - id: step-1
    host: settle-02
    command: [eum, burn, --cpu, "1", --duration, 7s]
  - id: step-2
    host: settle-02
    command: [eum, burn, --cpu, "1", --duration, 2s]
    depends: [step-1]
  - id: step-3
    host: settle-02
    command: [eum, burn, --cpu, "1", --duration, 4s]
    depends: [step-1]
