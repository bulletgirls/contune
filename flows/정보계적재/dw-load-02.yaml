# 보조 플로우(정보계적재): 모의 서버에서 CPU를 몇 초 쓰고 끝난다. deploy/gen_flows.sh로 만든다.
id: dw-load-02
schedule: "20 19 * * 1-5"
steps:
  - id: step-1
    host: dw-02
    command: [eum, burn, --cpu, "1", --duration, 5s]
  - id: step-2
    host: dw-02
    command: [eum, burn, --cpu, "1", --duration, 7s]
    depends: [step-1]
  - id: step-3
    host: dw-02
    command: [eum, burn, --cpu, "1", --duration, 2s]
    depends: [step-1]
