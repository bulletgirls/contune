# 보조 플로우(대외송수신): 모의 서버에서 CPU를 몇 초 쓰고 끝난다. deploy/gen_flows.sh로 만든다.
id: ext-send-report
schedule: "30 12 * * 1-5"
steps:
  - id: step-1
    host: ext-06
    command: [eum, burn, --cpu, "1", --duration, 6s]
  - id: step-2
    host: ext-06
    command: [eum, burn, --cpu, "1", --duration, 8s]
    depends: [step-1]
  - id: step-3
    host: ext-06
    command: [eum, burn, --cpu, "1", --duration, 3s]
    depends: [step-1]
