# 보조 플로우(대외송수신): 모의 서버에서 CPU를 몇 초 쓰고 끝난다. deploy/gen_flows.sh로 만든다.
id: ext-recv-price
schedule: "0 11 * * 1-5"
steps:
  - id: step-1
    host: ext-05
    command: [eum, burn, --cpu, "1", --duration, 2s]
  - id: step-2
    host: ext-05
    command: [eum, burn, --cpu, "1", --duration, 4s]
    depends: [step-1]
