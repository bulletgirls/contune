# 보조 플로우(대외송수신): 모의 서버에서 CPU를 몇 초 쓰고 끝난다. deploy/gen_flows.sh로 만든다.
id: ext-send-bank
schedule: "30 16 * * 1-5"
steps:
  - id: step-1
    host: ext-02
    command: [eum, burn, --cpu, "1", --duration, 7s]
  - id: step-2
    host: ext-02
    command: [eum, burn, --cpu, "1", --duration, 2s]
    depends: [step-1]
