# 모의 서버 39대. 실제 서버 7대(gw-01·match-01·feed-01·idx-01·feed-02·dw-01·batch-01)와 같은 매니저에 붙어 합계 46대(02 §13, 05 §2, 카드 V).
manager: http://manager:8080
token: ${EUM_TOKEN}
interval: 5s
remote: true                   # 로그 수집 설정을 화면(#collect)에서 받는다(05 §17). 읽기는 서버마다 log_dir 안만
allow:                         # 모의 서버도 명령을 실제로 실행하므로 deploy/agent-*.yaml과 같은 허용 목록(보안 S3)
  - '^eum burn( |$)'
  - '^\$\{DEMO\}/scripts/[A-Za-z0-9_-]+\.sh( |$)'
  - '^sleep [0-9]+$'
  - '^echo( |$)'
  - '^sh -c echo "\(E\) [^"$`\\]*"; exit [0-9]+$'
hosts:
  - { group: 채널,     prefix: gw,     from: 2, to: 6 }
  - { group: 채널,     prefix: ext,    from: 1, to: 6 }
  - { group: 매매체결, prefix: match,  from: 2, to: 8 }
  - { group: 매매통계, prefix: dw,     from: 2, to: 5 }   # dw-01은 실제 에이전트(매매통계 stats_svc)
  - { group: 정보분배, prefix: feed,   from: 3, to: 6 }   # feed-01(시세 quote_svc)·feed-02(분배 dist_svc)는 실제 에이전트
  - { group: 지수산출, prefix: idx,    from: 2, to: 3 }   # idx-01은 실제 에이전트(지수산출 index_svc)
  - { group: 청산결제, prefix: settle, from: 1, to: 4 }
  - { group: 청산결제, prefix: batch,  from: 2, to: 4 }
  - { group: rds,      prefix: rds,    from: 1, to: 4 }
faults:
  - { host: ext-04, kind: silent, after: 20s }
  - { host: dw-02,  kind: mem, value: 93 }
